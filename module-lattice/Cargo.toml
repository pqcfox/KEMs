[package]
name = "module-lattice"
description = """
Pure Rust implementation of operations on module lattices for cryptography."""
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0 OR MIT"
readme = "README.md"
homepage = "https://github.com/RustCrypto/KEMs/tree/master/module-lattice"
repository = "https://github.com/RustCrypto/KEMs"
categories = ["cryptography", "no-std"]
keywords = ["crypto", "lattice", "post-quantum"]

[features]
zeroize = ["dep:zeroize", "hybrid-array/zeroize"]

[dependencies]
hybrid-array = { version = "0.3", features = ["extra-sizes"] }
num-traits = "0.2.19"
zeroize = { version = "1.8.1", optional = true, default-features = false }
